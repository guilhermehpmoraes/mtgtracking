spring:
  application:
    name: mtgtracking-backend
  datasource:
    url: ${MTGTRACKING_DB_URL:jdbc:h2:mem:mtgtracking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${MTGTRACKING_DB_USERNAME:sa}
    password: ${MTGTRACKING_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health